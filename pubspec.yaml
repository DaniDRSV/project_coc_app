name: coc_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  signature: ^5.4.0
  provider: ^6.1.2
  pdf: ^3.10.8
  printing: ^5.11.1
  intl: ^0.19.0
  excel: ^4.0.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/assets/SC-login.jpg
    - lib/assets/icon.png
    - lib/assets/Recurso_8.png
